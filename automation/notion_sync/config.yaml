# ==========================================
# 重複検出
# 同一案件判定のfuzzy matchしきい値
# ==========================================
deduplication:
  enabled: true
  # Company + Project Name の組み合わせで判定
  method: "token_set_ratio"  # partial_ratio はAI/RPA等の短語に緩すぎ
  company_threshold: 92
  project_threshold: 88
  # 両方超えたら同一とみなす
  both_required: true
  # 8文字未満のproject_nameはdedup対象外（"AI"等の汎用短語での誤集約防止）
  min_name_length: 8
  # 両側のcompanyが非空の時のみdedup（Company空はほぼ別案件扱い）
  require_non_empty_company: true
  # 重複時の優先順位（先にあるほうを残す）
  priority_order:
    - "old_unified"    # 最も整備されている
    - "jp_pipeline"    # 契約ステータスなどの独自情報あり
    - "global_pipeline"  # データ品質低

# ==========================================
# 同期動作
# ==========================================
sync:
  # 新Unified v2に書き込む際、Source_DBに出身DBを必ず記録
  require_source_db: true
  # 旧DBページへの参照URLを Original_URL 列に保持
  preserve_original_url: true
  # 差分検出：new/updated/unchanged/deleted
  # deletedは旧DBで削除されたレコード。新Unified v2ではアーカイブ扱い（削除しない）
  on_deleted: "archive"  # "archive" or "ignore" or "delete"

# ==========================================
# ログ
# ==========================================
logging:
  level: "INFO"  # DEBUG / INFO / WARNING / ERROR
  dir: "logs"
  retention_days: 30
