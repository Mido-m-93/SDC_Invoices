name: Daily Reminder Check

on:
  schedule:
    # 00:00 UTC = 09:00 JST every day
    - cron: "0 0 * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI
    inputs:
      type:
        description: "Reminder type (all / missing_invoice / stale_review / due_date_approaching / due_date_overdue)"
        required: false
        default: "all"

jobs:
  send-reminders:
    name: Send daily reminders
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder check
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TYPE="${{ github.event.inputs.type || 'all' }}"
          echo "Sending reminders: type=$TYPE"

          RESPONSE=$(curl -s -L -w "\n%{http_code}" \
            -X POST "$APP_URL/api/reminders/send" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d "{\"month\":\"auto\",\"type\":\"$TYPE\"}")

          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo "Status: $STATUS"
          echo "Response: $BODY"

          if [ "$STATUS" != "200" ]; then
            echo "❌ Reminder API returned HTTP $STATUS"
            exit 1
          fi

          echo "✅ Reminders sent successfully"
